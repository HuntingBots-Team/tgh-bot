services:
  app:
    build: .
    command: bash start.sh
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - config.env
    volumes:
      # Service data directories
      - ./data/aria2:/usr/src/app/data/aria2:rw
      - ./data/qbittorrent:/usr/src/app/data/qbittorrent:rw
      - ./data/sabnzbd:/usr/src/app/data/sabnzbd:rw
      # Downloads directory with subdirectories
      - ./downloads:/usr/src/app/downloads:rw
      - ./downloads/incomplete:/usr/src/app/downloads/incomplete:rw
      - ./downloads/complete:/usr/src/app/downloads/complete:rw
      # For persistence between updates
      - ./config.env:/usr/src/app/config.env:ro
      # qBittorrent config persistence
      - ./qBittorrent/config:/root/.config/qBittorrent:rw
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
